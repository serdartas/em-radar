[project]
name = "em-radar-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "pyyaml",
    "sqlmodel",
]

[project.entry-points."em_radar.connectors"]
demo = "em_radar_connector_demo:DemoConnector"
gitlab = "em_radar_connector_gitlab:GitLabConnector"
jira = "em_radar_connector_jira:JiraConnector"

[project.entry-points."pytest11"]
em-radar-connector-contracts = "em_radar_connector_contracts.plugin"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "fastapi",
    "jsonschema",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = [
    "packages/core/src",
    "packages/connectors/demo/src",
    "packages/connectors/gitlab/src",
    "packages/connectors/jira/src",
    "packages/connectors/src",
    "packages/config/src",
    "packages/normalizer/src",
]

[tool.setuptools.data-files]
"packages/config/defaults" = ["packages/config/defaults/default-pack.yaml"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
markers = ["perf: performance benchmarks; run with -m perf"]

[tool.ruff]
line-length = 100
target-version = "py312"
