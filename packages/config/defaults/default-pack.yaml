apiVersion: emradar.dev/v1
kind: SignalPack
metadata:
  name: default-signals
  version: 1.0.0
  description: Default EM Radar signal pack - 8 work-item signals for Scrum teams using Jira.
spec:
  export_type: private_backup
  signals:
    - name: Stale in-progress work item
      description: Finds issues that have stayed in progress longer than expected.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: status_category
            operator: is
            value: in_progress
          - field: age_in_current_status
            operator: greater_than
            value: {amount: 7, unit: days}
      report_settings:
        severity: warning
        category: flow
      enabled: true
      origin: system_template
      template_key: stale-in-progress-work-item

    - name: Blocked without update
      description: Finds blocked issues that have not changed recently.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: status_category
            operator: is
            value: blocked
          - field: age_since_updated
            operator: greater_than
            value: {amount: 3, unit: days}
      report_settings:
        severity: critical
        category: flow
      enabled: true
      origin: system_template
      template_key: blocked-without-update

    - name: Story without acceptance criteria
      description: Finds stories missing acceptance criteria.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: story
          - field: acceptance_criteria
            operator: is_empty
      report_settings:
        severity: warning
        category: quality
      enabled: true
      origin: system_template
      template_key: story-without-acceptance-criteria

    - name: Story without parent epic
      description: Finds stories that are not linked to an epic.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: story
          - field: parent_id
            operator: is_empty
      report_settings:
        severity: info
        category: planning
      enabled: true
      origin: system_template
      template_key: story-without-parent-epic

    - name: Epic too broad
      description: Finds epics that exceed the default child-count threshold.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: epic
          - field: child_count
            operator: greater_than
            value: 15
      report_settings:
        severity: warning
        category: planning
      enabled: true
      origin: system_template
      template_key: epic-too-broad

    - name: Epic without measurable description
      description: Finds epics whose descriptions are too thin to evaluate.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: epic
          - field: description_length
            operator: less_than
            value: 100
      report_settings:
        severity: info
        category: planning
      enabled: true
      origin: system_template
      template_key: epic-without-measurable-description

    - name: Repeated carry-over
      description: Finds issues carried across multiple sprints.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: status_category
            operator: is_not
            value: done
          - field: sprint_count
            operator: greater_than
            value: 1
      report_settings:
        severity: warning
        category: delivery
      enabled: true
      origin: system_template
      template_key: repeated-carry-over

    - name: Sprint scope churn
      description: Finds sprints where scope was added after sprint start beyond the threshold.
      entity_type: sprint
      expression:
        type: group
        operator: all
        conditions:
          - field: sprint_scope_added_pct
            operator: greater_than
            value: 20.0
      report_settings:
        severity: warning
        category: delivery
      enabled: true
      origin: system_template
      template_key: sprint-scope-churn

  groups:
    - name: Default signals
      description: Bundled default signals for Jira + Scrum teams.
      signals:
        - Stale in-progress work item
        - Blocked without update
        - Story without acceptance criteria
        - Story without parent epic
        - Epic too broad
        - Epic without measurable description
        - Repeated carry-over
        - Sprint scope churn
