apiVersion: emradar.dev/v1
kind: SignalPack
metadata:
  name: default-signals
  version: 1.0.0
  description: Default EM Radar signal pack - 8 Jira work-item signals and 5 GitLab merge-request signals.
spec:
  export_type: private_backup
  signals:
    - name: Stale in-progress work item
      description: Finds issues that have stayed in progress longer than expected.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: status_category
            operator: is
            value: in_progress
          - field: age_in_current_status
            operator: greater_than
            value: {amount: 7, unit: days}
      report_settings:
        severity: warning
        category: flow
      origin: system_template
      template_key: stale-in-progress-work-item

    - name: Blocked without update
      description: Finds blocked issues that have not changed recently.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: status_category
            operator: is
            value: blocked
          - field: age_since_updated
            operator: greater_than
            value: {amount: 3, unit: days}
      report_settings:
        severity: critical
        category: flow
      origin: system_template
      template_key: blocked-without-update

    - name: Story without acceptance criteria
      description: Finds stories missing acceptance criteria.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: story
          - field: acceptance_criteria
            operator: is_empty
      report_settings:
        severity: warning
        category: quality
      origin: system_template
      template_key: story-without-acceptance-criteria

    - name: Story without parent epic
      description: Finds stories that are not linked to an epic.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: story
          - field: has_epic_parent
            operator: is
            value: false
      report_settings:
        severity: info
        category: planning
      origin: system_template
      template_key: story-without-parent-epic

    - name: Epic too broad
      description: Finds epics that exceed the default child-count threshold.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: epic
          - field: child_count
            operator: greater_than
            value: 15
      report_settings:
        severity: warning
        category: planning
      origin: system_template
      template_key: epic-too-broad

    - name: Epic without measurable description
      description: Finds epics whose descriptions are too thin to evaluate.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: issue_type
            operator: is
            value: epic
          - field: description_length
            operator: less_than
            value: 100
      report_settings:
        severity: info
        category: planning
      origin: system_template
      template_key: epic-without-measurable-description

    - name: Repeated carry-over
      description: Finds issues carried across multiple sprints.
      entity_type: issue
      expression:
        type: group
        operator: all
        conditions:
          - field: status_category
            operator: is_not
            value: done
          - field: sprint_count
            operator: greater_than
            value: 1
      report_settings:
        severity: warning
        category: delivery
      origin: system_template
      template_key: repeated-carry-over

    - name: Sprint scope churn
      description: Finds sprints where scope was added after sprint start beyond the threshold.
      entity_type: sprint
      expression:
        type: group
        operator: all
        conditions:
          - field: sprint_scope_added_pct
            operator: greater_than
            value: 20.0
      report_settings:
        severity: warning
        category: delivery
      origin: system_template
      template_key: sprint-scope-churn

    - name: Merge request waiting too long
      description: Finds open merge requests with no review activity in the past 3 days.
      entity_type: merge_request
      expression:
        type: group
        operator: all
        conditions:
          - field: state
            operator: is
            value: open
          - field: age_since_last_review_activity
            operator: greater_than
            value: {amount: 3, unit: days}
      report_settings:
        severity: warning
        category: flow
      origin: system_template
      template_key: mergerequest-waiting-too-long

    - name: Merge request without linked work item
      description: Finds open merge requests not linked to any tracked work item.
      entity_type: merge_request
      expression:
        type: group
        operator: all
        conditions:
          - field: state
            operator: is
            value: open
          - field: linked_workitem_keys
            operator: is_empty
      report_settings:
        severity: warning
        category: quality
      origin: system_template
      template_key: mergerequest-without-linked-workitem

    - name: Large merge request risk
      description: Finds merge requests exceeding the file-count or line-change threshold.
      entity_type: merge_request
      expression:
        type: group
        operator: any
        conditions:
          - field: changed_files_count
            operator: greater_than
            value: 20
          - field: total_changes
            operator: greater_than
            value: 500
      report_settings:
        severity: warning
        category: quality
      origin: system_template
      template_key: large-mergerequest-risk

    - name: Failing pipeline too long
      description: Finds merge requests whose pipeline has been failing for more than 1 day.
      entity_type: merge_request
      expression:
        type: group
        operator: all
        conditions:
          - field: pipeline_status
            operator: is
            value: failed
          - field: age_since_pipeline_update
            operator: greater_than
            value: {amount: 1, unit: days}
      report_settings:
        severity: warning
        category: flow
      origin: system_template
      template_key: failing-pipeline-too-long

    - name: Merged without enough approval
      description: Finds merge requests that were merged with no approvals.
      entity_type: merge_request
      expression:
        type: group
        operator: all
        conditions:
          - field: state
            operator: is
            value: merged
          - field: approval_count
            operator: less_than
            value: 1
      report_settings:
        severity: critical
        category: quality
      origin: system_template
      template_key: merged-without-enough-approval

  groups:
    - name: Default signals
      description: Bundled default signals for Jira + Scrum teams using GitLab.
      signals:
        - Stale in-progress work item
        - Blocked without update
        - Story without acceptance criteria
        - Story without parent epic
        - Epic too broad
        - Epic without measurable description
        - Repeated carry-over
        - Sprint scope churn
        - Merge request waiting too long
        - Merge request without linked work item
        - Large merge request risk
        - Failing pipeline too long
        - Merged without enough approval
